<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Atividade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Cadastro de Atividade</h1>

        <form method="POST" action="/salvar_atividade">
            <!-- Combo de Projetos -->
            <div class="mb-3">
                <label for="projeto" class="form-label">Projeto:</label>
                <select id="projeto" name="projeto_id" class="form-select" required>
                    <option value="">Selecione um projeto</option>
                    {% for projeto in projetos %}
                        <option value="{{ projeto.projeto_id }}">{{ projeto.nome_projeto }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Combo de Atividades Início -->
            <div class="mb-3">
                <label for="atividade_inicio" class="form-label">Atividade Início:</label>
                <select id="atividade_inicio" name="atividade_id_inicio" class="form-select" required>
                    <option value="">Selecione uma atividade</option>
                </select>
            </div>

            <!-- Combo de Atividades Fim -->
            <div class="mb-3">
                <label for="atividade_fim" class="form-label">Atividade Fim:</label>
                <select id="atividade_fim" name="atividade_id_fim" class="form-select" required>
                    <option value="">Selecione uma atividade</option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Salvar</button>
               <!--<button type="button" id="btnVisualizarGantt" class="btn btn-secondary">Visualizar Gantt</button>-->
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Carregar atividades quando projeto é selecionado
            $('#projeto').change(function() {
                const projetoId = $(this).val();
                const inicioSelect = $('#atividade_inicio');
                const fimSelect = $('#atividade_fim');

                inicioSelect.html('<option value="">Carregando...</option>');
                fimSelect.html('<option value="">Carregando...</option>');

                fetch(`/get_atividades/${projetoId}`)
                    .then(response => response.json())
                    .then(data => {
                        inicioSelect.html('<option value="">Selecione uma atividade</option>');
                        fimSelect.html('<option value="">Selecione uma atividade</option>');
                        
                        data.forEach(function(atividade) {
                            const option = `<option value="${atividade.id}">${atividade.nome} (${atividade.key_zoho})</option>`;
                            inicioSelect.append(option);
                            fimSelect.append(option);
                        });
                    });
            });

            // Visualizar Gantt
            $('#btnVisualizarGantt').click(function() {
                const inicioId = $('#atividade_inicio').val();
                const fimId = $('#atividade_fim').val();
                
                if (inicioId && fimId) {
                    window.location.href = `/visualizar_gantt_duplo/${inicioId}/${fimId}`;
                } else {
                    alert('Selecione ambas as atividades (início e fim)');
                }
            });
        });
    </script>
</body>
</html>
