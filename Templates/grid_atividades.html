<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Seleção de Atividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        .selected {
            background-color: #e6f7ff !important;
        }
        .dataTables_wrapper {
            margin-top: 20px;
        }
        #tabelaAtividades {
            width: 100% !important;
        }
        .zoho-key {
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4">Selecionar Atividades</h2>
        
        <table id="tabelaAtividades" class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>Selecionar</th>
                    <!--<th>ID</th>-->
                    <!--<th>Projeto</th>-->
                    <th>Key Projeto</th>
                    <th>Atividade</th>
                    <th>Key Atividade</th>
                    <th>Data</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dados serão carregados via AJAX -->
            </tbody>
        </table>
        
        <div class="mt-3">
            <button id="btnVisualizarGantt" class="btn btn-primary">
                Visualizar Gantt Selecionadas
            </button>
            <button id="btnLimparSelecao" class="btn btn-secondary">
                Limpar Seleção
            </button>
        </div>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    
    <script>
        $(document).ready(function() {
            let atividadesSelecionadas = [];
            
            // Configuração da DataTable com paginação
            const table = $('#tabelaAtividades').DataTable({
                ajax: {
                    url: '/api/ultimas_atividades',
                    dataSrc: '',
                    data: function(d) {
                        // Adiciona parâmetro para incluir dados do projeto
                        d.include_project = true;
                    }
                },
                columns: [
                    {
                        data: null,
                        render: function(data, type, row) {
                            return `<input type="checkbox" class="form-check-input select-atividade" data-id="${row.id}">`;
                        },
                        orderable: false,
                        width: '5%'
                    },
                    //{ 
                    //    data: 'atividade_id',
                    //    width: '10%'
                    //},
                    //{ 
                    //    data: 'projeto_id',
                    //    width: '10%' 
                    //},
                    { 
                        data: 'projeto_key_zoho',
                        render: function(data, type, row) {
                            return data ? `<span class="zoho-key">${data}</span>` : '-';
                        },
                        width: '15%'
                    },
                    { 
                        data: 'nome_atividade',
                        width: '20%'
                    },
                    { 
                        data: 'key_zoho',
                        render: function(data, type, row) {
                            return data ? `<span class="zoho-key">${data}</span>` : '-';
                        },
                        width: '15%'
                    },
                    { 
                        data: 'data_inicio',
                        width: '10%'
                    },
                    { 
                        data: 'status',
                        width: '10%'
                    }
                ],
                pageLength: 20,
                lengthMenu: [10, 20, 50, 100],
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.11.5/i18n/pt-BR.json'
                },
                createdRow: function(row, data, dataIndex) {
                    if (atividadesSelecionadas.includes(data.id)) {
                        $(row).addClass('selected');
                        $(row).find('.select-atividade').prop('checked', true);
                    }
                }
            });
            
            // Selecionar/deselecionar linha
            $('#tabelaAtividades tbody').on('click', 'tr', function(e) {
                if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') {
                    return;
                }
                
                const data = table.row(this).data();
                const checkbox = $(this).find('.select-atividade');
                
                if (atividadesSelecionadas.includes(data.id)) {
                    atividadesSelecionadas = atividadesSelecionadas.filter(id => id !== data.id);
                    $(this).removeClass('selected');
                    checkbox.prop('checked', false);
                } else {
                    atividadesSelecionadas.push(data.id);
                    $(this).addClass('selected');
                    checkbox.prop('checked', true);
                }
            });
            
            $('#btnVisualizarGantt').click(function() {
                if (atividadesSelecionadas.length === 0) {
                    alert('Selecione pelo menos uma atividade');
                    return;
                }
                window.open(`/visualizar_gantt_multiplo?ids=${atividadesSelecionadas.join(',')}`, '_blank');
            });
            
            $('#btnLimparSelecao').click(function() {
                atividadesSelecionadas = [];
                table.$('tr.selected').removeClass('selected');
                table.$('.select-atividade').prop('checked', false);
            });
        });
    </script>
</body>
</html>
