                    <!-- Modelo dinâmico -->
                    <form method="POST" action="/salvar_atividade"> 
                        <fieldset>
                            <legend>Filtros</legend>
                            <div class="row">
                                <!-- Combo de Áreas -->
                                <div class="col-sm-3 mb-3">
                                    <label for="area" class="form-label">Área:</label>
                                    <select id="area" name="area_id" class="form-select" required>
                                        <option value="">Selecione uma área</option>
                                        {% for area in areas %}
                                            <option value="{{ area.area_id }}">{{ area.nome_area }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                
                                <!-- Combo de Famílias --> 
                                <div class="col-sm-3 mb-3">
                                    <label for="familia" class="form-label">Família:</label>
                                    <select id="familia" name="familia_id" class="form-select" required>
                                        <option value="">Selecione uma família</option>
                                        {% for familia in familias %}
                                            <option value="{{ familia.familia_id }}">{{ familia.nome_familia }}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <!-- Checkbox -->

                                <div class="col-sm-3 pt-4 pb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" checked>
                                        <label class="form-check-label" for="checkChecked">
                                            Atividades para projeto
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" checked>
                                        <label class="form-check-label" for="checkChecked">
                                            Bloco para projeto
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </fieldset>
                        <!-- Falta button-->
                    </form>
                </div>

                <div class="col-sm-12 col-md-3 d-flex flex-column gap-0">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th class="text-center">LEGENDA</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <i class="bi bi-exclamation-lg text-success"></i> Hoje
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <i class="bi bi-suit-diamond-fill text-info"></i> Projeto congelado
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <i class="bi bi-suit-diamond-fill text-warning"></i> Lote Brasil
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
