<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gráfico Gantt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        .gantt-container {
            width: 90%;
            max-width: 1200px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .bar-projeto {
            fill: #6c757d;
        }
        .bar-atividade {
            fill: #0d6efd;
        }
        .axis text {
            font-size: 12px;
        }
        .axis-label {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="gantt-container">
        <h2 class="text-center mb-4">Gráfico Gantt</h2>
        <div id="gantt-chart"></div>
        <div class="text-center mt-4">
            <a href="/grid_atividades" class="btn btn-secondary">Voltar</a>
        </div>
    </div>

    <script>
        // Dados do Gantt passados pelo Flask
        const dadosGantt = {{ dados_gantt|tojson|safe }};
        
        // Configurações do gráfico
        const margin = {top: 50, right: 50, bottom: 50, left: 100};
        const width = 1000 - margin.left - margin.right;
        const height = 300 - margin.top - margin.bottom;
        
        // Parse das datas
        const parseDate = d3.timeParse("%Y-%m-%d");
        const projetoStart = parseDate(dadosGantt.projeto.start);
        const projetoEnd = parseDate(dadosGantt.projeto.end);
        const atividadeStart = parseDate(dadosGantt.atividade.start);
        const atividadeEnd = parseDate(dadosGantt.atividade.end);
        
        // Encontrar o range mínimo e máximo de datas
        const minDate = d3.min([projetoStart, atividadeStart]);
        const maxDate = d3.max([projetoEnd, atividadeEnd]);
        
        // Criar escala de tempo
        const x = d3.scaleTime()
            .domain([minDate, maxDate])
            .range([0, width]);
        
        // Criar SVG
        const svg = d3.select("#gantt-chart")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);
        
        // Adicionar eixo X
        svg.append("g")
            .attr("class", "axis axis--x")
            .attr("transform", `translate(0,${height/2})`)
            .call(d3.axisBottom(x).ticks(10));
        
        // Adicionar barras
        // Barra do projeto (mais clara, no fundo)
        svg.append("rect")
            .attr("class", "bar-projeto")
            .attr("x", x(projetoStart))
            .attr("y", height/2 - 20)
            .attr("width", x(projetoEnd) - x(projetoStart))
            .attr("height", 40)
            .attr("rx", 5)
            .attr("ry", 5);
        
        // Barra da atividade (mais escura, sobreposta)
        svg.append("rect")
            .attr("class", "bar-atividade")
            .attr("x", x(atividadeStart))
            .attr("y", height/2 - 15)
            .attr("width", x(atividadeEnd) - x(atividadeStart))
            .attr("height", 30)
            .attr("rx", 5)
            .attr("ry", 5);
        
        // Adicionar rótulos
        svg.append("text")
            .attr("class", "axis-label")
            .attr("x", x(projetoStart))
            .attr("y", height/2 - 30)
            .text(dadosGantt.projeto.name);
        
        svg.append("text")
            .attr("class", "axis-label")
            .attr("x", x(atividadeStart))
            .attr("y", height/2 + 50)
            .text(dadosGantt.atividade.name);
        
        // Adicionar legenda
        const legend = svg.append("g")
            .attr("transform", `translate(0,${height + 30})`);
        
        legend.append("rect")
            .attr("x", 0)
            .attr("width", 15)
            .attr("height", 15)
            .attr("fill", "#6c757d");
        
        legend.append("text")
            .attr("x", 20)
            .attr("y", 12)
            .text("Projeto");
        
        legend.append("rect")
            .attr("x", 100)
            .attr("width", 15)
            .attr("height", 15)
            .attr("fill", "#0d6efd");
        
        legend.append("text")
            .attr("x", 120)
            .attr("y", 12)
            .text("Atividade");
    </script>
</body>
