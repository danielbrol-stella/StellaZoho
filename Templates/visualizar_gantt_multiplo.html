<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gráfico Gantt - Intervalo entre Inícios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .gantt-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .bar-intervalo {
            rx: 5;
            ry: 5;
            height: 30px;
            opacity: 0.7;
        }
        .axis text {
            font-size: 12px;
        }
        .activity-label {
            font-size: 12px;
            font-weight: 500;
        }
        .legenda {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .legenda-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legenda-cor {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
        .tick line {
            stroke: #eee;
        }
        .dashed-line {
            stroke: #666;
            stroke-width: 1px;
            stroke-dasharray: 5,5;
            opacity: 0.6;
        }
        .date-label {
            font-size: 11px;
            fill: #666;
            text-anchor: middle;
        }
        .project-title {
            color: #6c757d;
            font-size: 1.2rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="d-inline-block" id="project-name-title">Linha de tempo do projeto</h2>
            </div>
            <a href="javascript:window.close()" class="btn btn-secondary">Fechar</a>
        </div>
        
        <div class="gantt-container">
            <div id="gantt-chart"></div>
            <div id="legenda" class="legenda"></div>
        </div>
    </div>

    <script>
        // Obter IDs das atividades da URL
        const urlParams = new URLSearchParams(window.location.search);
        const ids = urlParams.get('ids').split(',');
        
 // Função para buscar o nome do projeto
function fetchProjectName(projeto_id) {
    return fetch(`/api/get_projeto_nome?projeto_id=${projeto_id}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Erro ao buscar nome do projeto');
            }
            return response.json();
        })
        .then(data => {
            if (data.error) {
                console.error(data.error);
                // Mostra pelo menos o ID se não encontrar o nome
                document.getElementById('project-name-title').textContent = `Projeto (ID: ${projeto_id})`;
            } else {
                // Formata o nome do projeto com a primeira letra de cada palavra em maiúscula
                const nomeFormatado = data.nome_projeto
                    .toLowerCase()
                    .split(' ')
                    .map(palavra => palavra.charAt(0).toUpperCase() + palavra.slice(1))
                    .join(' ');
                
                document.getElementById('project-name-title').textContent = nomeFormatado;
            }
        })
        .catch(error => {
            console.error('Erro ao buscar nome do projeto:', error);
            document.getElementById('project-name-title').textContent = `Projeto (ID: ${projeto_id})`;
        });
}

// Modifique a chamada principal para:
fetch(`/api/atividades_selecionadas?ids=${ids.join(',')}`)
    .then(response => response.json())
    .then(data => {
        if (data.length === 0) {
            document.getElementById('gantt-chart').innerHTML = 
                '<div class="alert alert-warning">Nenhuma atividade encontrada</div>';
            return;
        }
        
        // Buscar e mostrar nome do projeto
        if (data[0] && data[0].projeto_id) {
            fetchProjectName(data[0].projeto_id);
        } else {
            document.getElementById('project-name-title').textContent = 'Projeto não especificado';
        }
        
        desenharGantt(data);
    })
    .catch(error => {
        console.error('Erro:', error);
        document.getElementById('gantt-chart').innerHTML = 
            '<div class="alert alert-danger">Erro ao carregar dados</div>';
    });
        
        function desenharGantt(atividades) {
            // Ordenar atividades por data de início
            atividades.sort((a, b) => new Date(a.data_inicio) - new Date(b.data_fim));
            
            // Configurações do gráfico
            const margin = {top: 40, right: 30, bottom: 50, left: 150};
            const width = 1000 - margin.left - margin.right;
            const height = 400 - margin.top - margin.bottom;
            
            // Parse das datas
            const parseDate = d3.timeParse("%Y-%m-%d");
            const formatDate = d3.timeFormat("%d/%m/%Y");
            
            // Criar array de intervalos
            const intervalos = [];
            for (let i = 0; i < atividades.length - 1; i++) {
                intervalos.push({
                    inicio: parseDate(atividades[i].data_inicio),
                    fim: parseDate(atividades[i+1].data_inicio),
                    atividade1: atividades[i].nome_atividade,
                    atividade2: atividades[i+1].nome_atividade,
                    id: `${atividades[i].id}-${atividades[i+1].id}`,
                    data_inicio_str: atividades[i].data_inicio,
                    data_fim_str: atividades[i+1].data_inicio
                });
            }
            
            // Criar escalas
            const x = d3.scaleTime()
                .domain([
                    d3.min(intervalos, d => d.inicio),
                    d3.max(intervalos, d => d.fim)
                ])
                .range([0, width])
                .nice();
            
            const y = d3.scaleBand()
                .domain(intervalos.map(d => d.id))
                .range([0, height])
                .padding(0.2);
            
            // Criar SVG
            
            const svg = d3.select("#gantt-chart")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);
            
            // Adicionar eixo X (linha do tempo)
            svg.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x)
                    .tickFormat(formatDate)
                    .tickSizeOuter(0));
            
            // Adicionar grade
            svg.append("g")
                .attr("class", "grid")
                .call(d3.axisLeft(y)
                    .tickSize(-width)
                    .tickFormat(""))
                .selectAll(".tick line")
                .attr("stroke", "#f5f5f5");
            
            // Adicionar linhas verticais pontilhadas nos extremos
            intervalos.forEach(intervalo => {
                // Linha no início do intervalo
                svg.append("line")
                    .attr("class", "dashed-line")
                    .attr("x1", x(intervalo.inicio))
                    .attr("x2", x(intervalo.inicio))
                    .attr("y1", 0)
                    .attr("y2", height);
                
                // Linha no fim do intervalo
                svg.append("line")
                    .attr("class", "dashed-line")
                    .attr("x1", x(intervalo.fim))
                    .attr("x2", x(intervalo.fim))
                    .attr("y1", 0)
                    .attr("y2", height);
                
                // Rótulo da data inicial
                svg.append("text")
                    .attr("class", "date-label")
                    .attr("x", x(intervalo.inicio))
                    .attr("y", -10)
                    .text(formatDate(intervalo.inicio));
                
                // Rótulo da data final (apenas para o último intervalo)
                if (intervalo === intervalos[intervalos.length - 1]) {
                    svg.append("text")
                        .attr("class", "date-label")
                        .attr("x", x(intervalo.fim))
                        .attr("y", -10)
                        .text(formatDate(intervalo.fim));
                }
            });
            
            // Adicionar barras de intervalo
            
            svg.selectAll(".bar-intervalo")
                .data(intervalos)
                .enter()
                .append("rect")
                .attr("class", "bar-intervalo")
                .attr("x", d => x(d.inicio))
                .attr("y", d => y(d.id))
                .attr("width", d => Math.max(1, x(d.fim) - x(d.inicio)))
                .attr("height", y.bandwidth())
                .attr("fill", (d, i) => d3.schemeCategory10[i % 10])
                .attr("rx", 5)
                .attr("ry", 5);
            
            // Adicionar rótulos das atividades
            svg.selectAll(".intervalo-label")
                .data(intervalos)
                .enter()
                .append("text")
                .attr("class", "activity-label")
                .attr("x", d => x(d.inicio) - 10)
                .attr("y", d => y(d.id) + y.bandwidth()/2)
                .attr("dy", "0.35em")
                .attr("text-anchor", "end")
                .text(d => `${d.atividade1} → ${d.atividade2}`);
            
            // Adicionar duração
            /*
            svg.selectAll(".duracao-label")
                .data(intervalos)
                .enter()
                .append("text")
                .attr("class", "activity-label")
                .attr("x", d => x(d.inicio) + (x(d.fim) - x(d.inicio))/2)
                .attr("y", d => y(d.id) + y.bandwidth()/2)
                .attr("dy", "0.35em")
                .attr("text-anchor", "middle")
                .text(d => {
                    const diff = Math.round((d.fim - d.inicio) / (1000 * 60 * 60 * 24));
                    return `${diff} dia${diff !== 1 ? 's' : ''}`;
                });
            */
            // Adicionar legenda
            const legenda = d3.select("#legenda");
            intervalos.forEach((intervalo, i) => {
                const item = legenda.append("div")
                    .attr("class", "legenda-item");
                
                item.append("div")
                    .attr("class", "legenda-cor")
                    .style("background-color", d3.schemeCategory10[i % 10]);
                
                item.append("span")
                    .text(`${intervalo.atividade1} → ${intervalo.atividade2}`);
            });
        }
    </script>
</body>
</html>
